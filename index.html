<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>REMO — Karakter 3D Original</title>
<style>
  :root { --bg: #0c0e12; --panel: #15181f; --line: #262b35; --text: #e8e6df; --dim: #9a978c; --accent: #e8a020; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
  #app { display: flex; flex-direction: column; height: 100%; }
  header { display: flex; align-items: baseline; gap: 12px; padding: 14px 18px 10px; }
  header h1 { font-size: 20px; letter-spacing: .04em; }
  header p { color: var(--dim); font-size: 13px; }
  #stage { flex: 1; position: relative; min-height: 0; }
  #stage canvas { display: block; width: 100%; height: 100%; }
  #hint { position: absolute; left: 14px; bottom: 12px; color: var(--dim); font-size: 12px; pointer-events: none; }
  #controls { background: var(--panel); border-top: 1px solid var(--line); padding: 12px 18px 16px; display: flex; flex-wrap: wrap; gap: 18px 28px; }
  .group { display: flex; flex-direction: column; gap: 6px; }
  .group > span { font-size: 11px; letter-spacing: .12em; color: var(--dim); text-transform: uppercase; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  button { background: #22262f; color: var(--text); border: 1px solid var(--line); border-radius: 999px; padding: 7px 14px; font-size: 13px; cursor: pointer; }
  button:hover { border-color: #3a4050; }
  button.active { background: var(--accent); color: #16130a; border-color: var(--accent); font-weight: 600; }
  button.action { background: #1f3a2d; border-color: #2f5b45; }
  button.action:hover { border-color: #3f7a5d; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/build/three.module.js",
    "three/addons/": "./vendor/three/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="app">
  <header>
    <h1>REMO</h1>
    <p>Karakter 3D original &mdash; rig siap animasi, export GLB buat render GPU. Bukan karakter NULLS.</p>
  </header>
  <div id="stage">
    <div id="hint">Geser buat muter &middot; scroll buat zoom &middot; klik kanan geser buat pan</div>
  </div>
  <div id="controls">
    <div class="group">
      <span>Warna outfit</span>
      <div class="row" id="outfitBtns">
        <button data-outfit="mustard" class="active">Mustard</button>
        <button data-outfit="grape">Grape</button>
        <button data-outfit="mint">Mint</button>
      </div>
    </div>
    <div class="group">
      <span>Ekspresi</span>
      <div class="row" id="exprBtns">
        <button data-expr="santai" class="active">Santai</button>
        <button data-expr="senang">Senang</button>
        <button data-expr="kaget">Kaget</button>
        <button data-expr="tidur">Tidur</button>
      </div>
    </div>
    <div class="group">
      <span>Pose</span>
      <div class="row" id="poseBtns">
        <button data-pose="diam" class="active">Diam</button>
        <button data-pose="dadah">Dadah</button>
        <button data-pose="duduk">Duduk</button>
        <button data-pose="ceria">Ceria</button>
      </div>
    </div>
    <div class="group">
      <span>Putar</span>
      <div class="row"><button id="rotBtn" class="active">Otomatis</button></div>
    </div>
    <div class="group">
      <span>Export</span>
      <div class="row"><button id="glbBtn" class="action">Download GLB</button></div>
    </div>
  </div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
